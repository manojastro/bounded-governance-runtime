# Agent identities registered with Bounded. Deny-by-default: an agent not
# listed here cannot submit anything.
agents:
  - id: reckless-rs
    display: "Reckless Rookie (demo agent)"
    allowed_adapters: ["kubernetes", "terraform"]
    allowed_verbs: ["create", "update", "patch", "scale"]   # never delete, never grant
    allowed_namespaces: ["shop", "dev-sandbox"]             # prod payments is off-limits
    may_touch_tier0: false
    max_actions_per_day: 40

  - id: deploy-bot
    display: "Platform Deploy Bot"
    allowed_adapters: ["kubernetes", "terraform"]
    allowed_verbs: ["create", "update", "patch", "scale", "delete", "grant"]
    allowed_namespaces: ["*"]
    may_touch_tier0: false
    max_actions_per_day: 100

  - id: spammy-ci
    display: "Chatty CI Bot (quota demo)"
    allowed_adapters: ["kubernetes"]
    allowed_verbs: ["create", "update", "patch", "scale"]
    allowed_namespaces: ["dev-sandbox"]
    may_touch_tier0: false
    max_actions_per_day: 3

  - id: payments-sre
    display: "Payments on-call (tier-0 operator)"
    allowed_adapters: ["kubernetes"]
    allowed_verbs: ["create", "update", "patch", "scale"]
    allowed_namespaces: ["payments"]
    may_touch_tier0: true
    max_actions_per_day: 10
